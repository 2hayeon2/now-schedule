<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Now — 현재에 머무는 일정</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --card-done: #f3f5f8;
    --text: #2b2b2b;
    --muted: #8a8a8a;
    --line: #e7e5e0;
    --accent: #4a6fa5;
    --done: #b8b8b8;
    --danger: #d9534f;
    --tomorrow: #5a9a6e;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; padding-bottom: 110px; }

  header { padding: 28px 20px 12px; }
  header .date-btn {
    background: none; border: none; font-family: inherit; font-size: 13px; color: var(--muted);
    cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 4px;
  }
  header .date-btn .caret { font-size: 10px; opacity: .7; }
  header h1 { font-size: 24px; font-weight: 600; margin-top: 4px; }
  header .ro-note { font-size: 12px; color: #b0ada6; margin-top: 6px; }
  header .today-btn {
    background: none; border: none; font-family: inherit; font-size: 14px; color: var(--accent);
    cursor: pointer; padding: 4px 0; margin-top: 8px;
  }
  header .back {
    background: none; border: none; font-size: 15px; color: var(--accent);
    cursor: pointer; padding: 4px 0; margin-bottom: 6px; font-family: inherit;
  }
  header .tag-label { font-size: 13px; color: var(--muted); }

  section.period { padding: 8px 20px 4px; }
  section.period h2 {
    font-size: 13px; font-weight: 600; color: var(--muted);
    letter-spacing: .04em; margin-bottom: 8px; display: flex; justify-content: space-between;
  }
  .empty-hint { font-size: 13px; color: #c0bdb6; padding: 6px 2px 10px; }

  /* 일정 항목 래퍼 (스와이프 배경 + 순서 변경 이동) */
  .item-wrap {
    position: relative; overflow: hidden; border-radius: var(--radius); margin-bottom: 8px;
    transition: transform .22s ease;
  }
  .item-wrap.reordering { z-index: 5; transition: none; opacity: .95; }
  .item-actions {
    position: absolute; inset: 0; display: flex; align-items: stretch;
  }
  .item-actions .left-action, .item-actions .right-action {
    display: flex; align-items: center; color: #fff; font-size: 14px; font-weight: 600;
    padding: 0 20px; width: 50%;
  }
  .item-actions .left-action { background: var(--tomorrow); justify-content: flex-start; }
  .item-actions .right-action { background: var(--danger); justify-content: flex-end; }

  .item {
    position: relative; background: var(--card); border-radius: var(--radius);
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    transition: transform .25s ease, background-color .35s ease;
    touch-action: pan-y;
    cursor: pointer;
  }
  .item.dragging { transition: none; }
  .item.done { background: var(--card-done); }
  .item.pulse { animation: pulse .4s ease; }
  @keyframes pulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(.97); }
    100% { transform: scale(1); }
  }
  /* 지난 날짜: 조회 전용 */
  .item-wrap.readonly .item { cursor: default; touch-action: auto; }

  .item .body { flex: 1; min-width: 0; }
  .item .title {
    font-size: 16px; word-break: keep-all;
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0% 1.5px; background-repeat: no-repeat; background-position: 0 58%;
    transition: background-size .45s ease, color .35s ease;
  }
  .item.done .title { color: var(--done); background-size: 100% 1.5px; }
  .item .meta { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .item .time-info { font-size: 12px; color: var(--muted); }

  /* 완료 체크: 완료 상태에서만 DOM에 존재 */
  .item .check {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px;
  }
  .item .check::after { content: "✓"; }
  .item .check.enter { animation: pop .38s cubic-bezier(.34,1.56,.64,1); }
  .item .check.leave { animation: fadeout .2s ease forwards; }
  @keyframes pop {
    0%   { transform: scale(.2); opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes fadeout {
    to { transform: scale(.4); opacity: 0; }
  }

  /* 순서 변경 핸들 */
  .handle {
    font-size: 20px; line-height: 1; color: #bdb9b0; padding: 6px 2px 6px 6px;
    cursor: grab; touch-action: none; flex-shrink: 0;
  }

  .tag {
    display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: #eef2f8; color: var(--accent); cursor: pointer; border: none;
    font-family: inherit;
  }
  .tag:active { opacity: .6; }

  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; line-height: 1.7; }

  /* + 버튼 */
  .fab {
    position: fixed; right: max(20px, calc(50% - 240px + 20px)); bottom: 28px;
    width: 58px; height: 58px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 30px; line-height: 1;
    box-shadow: 0 6px 16px rgba(74,111,165,.35); cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .fab:active { transform: scale(.95); }

  /* 토스트 */
  #toast {
    position: fixed; left: 50%; bottom: 104px; transform: translate(-50%, 16px);
    background: #2b2b2b; color: #fff; font-size: 14px; padding: 10px 16px;
    border-radius: 999px; opacity: 0; pointer-events: none; z-index: 30;
    transition: opacity .25s ease, transform .25s ease; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 모달 공통 */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 22px 20px 28px; max-height: 92vh; overflow-y: auto;
    animation: up .25s ease;
    user-select: text; -webkit-user-select: text;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h3 { font-size: 18px; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input[type="text"], .field input[type="date"] {
    width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 10px; font-family: inherit; background: #fff; color: var(--text);
  }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; font-size: 14px; font-family: inherit; cursor: pointer; color: var(--text);
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }
  .notice { font-size: 12px; color: var(--danger); margin-top: 6px; min-height: 16px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: #d6d3cc; border-radius: 26px; cursor: pointer; transition: .2s;
  }
  .switch span::before {
    content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .repeat-opts { margin-top: 12px; display: none; }
  .repeat-opts.show { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-btn {
    padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff;
    font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .chip-btn.on { background: #eef2f8; border-color: var(--accent); color: var(--accent); }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions button {
    flex: 1; padding: 14px 0; border-radius: 12px; font-size: 16px; font-family: inherit; cursor: pointer; border: none;
  }
  .btn-cancel { background: #f0eee9; color: var(--text); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:disabled { opacity: .4; cursor: not-allowed; }

  /* 날짜 선택 캘린더 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-head .nav {
    background: none; border: none; font-size: 24px; color: var(--accent); cursor: pointer;
    padding: 2px 12px; font-family: inherit;
  }
  .cal-head .ym { font-size: 16px; font-weight: 600; }
  .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .cal-week div { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .cal-grid { row-gap: 4px; }
  .cal-day {
    position: relative; height: 42px; border: none; background: none; border-radius: 10px;
    font-family: inherit; font-size: 15px; color: var(--text); cursor: pointer;
  }
  .cal-day.past { color: #b0ada6; }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cal-day.sel { background: var(--accent); color: #fff; box-shadow: none; }
  .cal-day .dot {
    position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .cal-day.sel .dot { background: #fff; }
  .cal-preview { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .cal-preview .p-title { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .cal-row { display: flex; gap: 10px; padding: 7px 0; font-size: 15px; align-items: baseline; }
  .cal-row .pl { font-size: 12px; color: var(--muted); width: 28px; flex-shrink: 0; }
  .cal-row.done .pt { color: var(--done); text-decoration: line-through; }
  .cal-empty { font-size: 13px; color: #c0bdb6; padding: 8px 0; }
</style>
</head>
<body>
<div id="app"></div>

<button class="fab" id="fab" aria-label="일정 추가">+</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function () {
  "use strict";

  /* ================= 저장소 (localStorage) ================= */
  const STORAGE_KEY = "now-schedule-v1";

  const PERIODS = [
    { key: "morning",   label: "오전", start: "07:00", end: "12:00" },
    { key: "afternoon", label: "오후", start: "12:00", end: "17:00" },
    { key: "evening",   label: "저녁", start: "17:00", end: "22:00" },
  ];
  const MAX_PER_PERIOD = 3;
  const REPEAT_LABEL = { daily: "매일", weekly: "매주", monthly: "매월" };

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { items: [] };
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed.items) ? parsed : { items: [] };
    } catch (e) {
      return { items: [] };
    }
  }
  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  }

  /*
   * 항목 구조
   * {
   *   id, title, period ("morning"|"afternoon"|"evening"), tags: [],
   *   startDate: "YYYY-MM-DD"  // 일정이 시작되는 날짜 (추가 시 선택한 날짜)
   *   repeat: null | { type: "daily"|"weekly"|"monthly", endDate: "YYYY-MM-DD" | null },
   *   overrides: { "YYYY-MM-DD": { done, moved, deleted } },  // 반복 일정의 날짜별 예외
   *   incoming: ["YYYY-MM-DD"],  // 다른 날짜에서 '내일로' 넘어온 날짜 (반복 일정 전용)
   *   createdAt
   * }
   */

  /* ================= 날짜 유틸 ================= */
  function pad(n) { return String(n).padStart(2, "0"); }
  function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function parseKey(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
  function todayKey() { return toKey(new Date()); }
  function addDays(key, n) { const d = parseKey(key); d.setDate(d.getDate() + n); return toKey(d); }
  function formatHeaderDate(key) {
    const d = parseKey(key);
    const w = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${w})`;
  }
  function formatShortDate(key) {
    const d = parseKey(key);
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  }

  /* 특정 날짜(dateKey)에 항목의 "원래 규칙"상 발생하는지 */
  function occursOn(item, dateKey) {
    if (dateKey < item.startDate) return false;
    if (!item.repeat) return dateKey === item.startDate;
    if (item.repeat.endDate && dateKey > item.repeat.endDate) return false;
    const d = parseKey(dateKey);
    const s = parseKey(item.startDate);
    switch (item.repeat.type) {
      case "daily":
        return true;
      case "weekly":
        return d.getDay() === s.getDay();
      case "monthly": {
        // 시작일의 '일' 기준. 말일이 짧은 달은 그 달의 마지막 날로 대체
        const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        return d.getDate() === Math.min(s.getDate(), last);
      }
    }
    return false;
  }

  /* 특정 날짜의 개별 상태 (overrides) */
  function stateOn(item, dateKey) {
    const ov = (item.overrides && item.overrides[dateKey]) || {};
    return { done: !!ov.done, deleted: !!ov.deleted, moved: ov.moved || null };
  }

  /* 특정 날짜에 보여야 하는지 (용량 계산과 화면 렌더링이 동일한 기준을 사용) */
  function isVisibleOn(item, dateKey) {
    const s = stateOn(item, dateKey);
    if (s.deleted) return false;
    if (item.repeat && (item.incoming || []).includes(dateKey)) return true;
    return occursOn(item, dateKey) && !s.moved;
  }

  /* 특정 날짜의 전체 표시 대상 (저장 배열 순서 = 화면 표시 순서) */
  function itemsOn(dateKey) {
    if (!dateKey) return [];
    return state.data.items.filter(it => isVisibleOn(it, dateKey));
  }
  function countOn(dateKey, periodKey) {
    return itemsOn(dateKey).filter(it => it.period === periodKey).length;
  }

  /* ================= 상태 ================= */
  const state = {
    data: loadData(),
    view: { name: "home" },           // home | tag
    viewDate: todayKey(),             // 홈 화면에서 보고 있는 날짜
  };
  let calState = null;                // 캘린더 시트 상태
  let modal = null;                   // "form" | "calendar" | null

  function findItem(id) { return state.data.items.find(i => i.id === id); }
  function repeatLabel(it) {
    if (!it.repeat) return "";
    return REPEAT_LABEL[it.repeat.type] + (it.repeat.endDate ? " · ~" + formatShortDate(it.repeat.endDate) : "");
  }
  function periodLabel(key) { return PERIODS.find(p => p.key === key).label; }

  /* ================= 공통 UI ================= */
  const app = document.getElementById("app");
  const overlay = document.getElementById("overlay");
  const sheet = document.getElementById("sheet");
  const fab = document.getElementById("fab");

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function showToast(msg) {
    let t = document.getElementById("toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._hide);
    t._hide = setTimeout(() => t.classList.remove("show"), 1600);
  }

  /* ================= 렌더: 홈 ================= */
  function renderHome() {
    const today = todayKey();
    const v = state.viewDate;
    const isToday = v === today;
    const readonly = v < today;          // 지난 날짜: 조회 전용
    const items = itemsOn(v);

    const title = isToday ? "오늘에 집중하기" : (readonly ? "지난 일정" : "예정된 일정");

    let html = `
      <header>
        <button class="date-btn" id="dateBtn">${formatHeaderDate(v)} <span class="caret">▾</span></button>
        <h1>${title}</h1>
        ${readonly ? `<div class="ro-note">지난 날짜는 조회만 할 수 있습니다</div>` : ""}
        ${!isToday ? `<button class="today-btn" id="todayBtn">← 오늘로 돌아가기</button>` : ""}
      </header>`;

    if (items.length === 0) {
      html += `<div class="empty-state">${isToday
        ? "오늘은 비어 있습니다.<br>지금 이 순간에 집중할 일이 있다면 + 로 추가해 보세요."
        : "이 날은 일정이 없습니다."}</div>`;
    }

    PERIODS.forEach(p => {
      const list = items.filter(it => it.period === p.key);
      html += `
        <section class="period">
          <h2><span>${p.label} <span style="font-weight:400">${p.start}–${p.end}</span></span><span>${list.length}/${MAX_PER_PERIOD}</span></h2>
          ${list.length === 0 ? `<div class="empty-hint">비어 있음</div>` : ""}
          ${list.map(it => renderItem(it, v, readonly)).join("")}
        </section>`;
    });

    app.innerHTML = html;
    bindHomeEvents(readonly);

    document.getElementById("dateBtn").addEventListener("click", openCalendar);
    const tb = document.getElementById("todayBtn");
    if (tb) tb.addEventListener("click", () => {
      state.viewDate = todayKey();
      render();
      window.scrollTo(0, 0);
    });

    fab.style.display = readonly ? "none" : "flex";
  }

  function renderItem(it, dateKey, readonly) {
    const s = stateOn(it, dateKey);
    const tags = (it.tags || []).map(t => `<button class="tag" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</button>`).join("");
    const repeatBadge = it.repeat ? `<span class="time-info">${repeatLabel(it)}</span>` : "";
    return `
      <div class="item-wrap ${readonly ? "readonly" : ""}" data-id="${it.id}" data-date="${dateKey}">
        <div class="item-actions">
          <div class="left-action">→ 내일로</div>
          <div class="right-action">삭제 ←</div>
        </div>
        <div class="item ${s.done ? "done" : ""}">
          ${s.done ? `<div class="check"></div>` : ""}
          <div class="body">
            <div class="title">${escapeHtml(it.title)}</div>
            <div class="meta">${tags}${repeatBadge}</div>
          </div>
          ${readonly ? "" : `<div class="handle" aria-label="순서 변경">≡</div>`}
        </div>
      </div>`;
  }

  /* ================= 이벤트: 홈 ================= */
  function bindHomeEvents(readonly) {
    app.querySelectorAll(".item-wrap").forEach(wrap => {
      if (!readonly) {
        const card = wrap.querySelector(".item");
        const handle = wrap.querySelector(".handle");
        attachGestures(wrap, card);
        attachReorder(handle, wrap);
      }
    });
    app.querySelectorAll(".tag").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        openTagView(btn.dataset.tag);
      });
    });
  }

  /* 스와이프 + 길게 누르기 */
  function attachGestures(wrap, card) {
    const id = wrap.dataset.id;
    const dateKey = wrap.dataset.date;
    let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false;
    let pressTimer = null, longFired = false;
    const THRESH = 80;
    const LONG_MS = 550;

    function clearPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }

    card.addEventListener("pointerdown", e => {
      if (e.button !== 0 && e.pointerType === "mouse") return;
      startX = e.clientX; startY = e.clientY; dx = 0;
      dragging = true; decided = false; horizontal = false; longFired = false;
      card.setPointerCapture(e.pointerId);
      clearPress();
      pressTimer = setTimeout(() => {
        if (!horizontal && Math.abs(dx) < 6) {
          longFired = true;
          toggleDone(id, dateKey, wrap);
          if (navigator.vibrate) navigator.vibrate(12);
        }
      }, LONG_MS);
    });

    card.addEventListener("pointermove", e => {
      if (!dragging) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if (!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
        decided = true;
        horizontal = Math.abs(mx) > Math.abs(my);
        if (horizontal) clearPress();
        else { dragging = false; clearPress(); }
      }
      if (!horizontal) return;
      dx = mx;
      card.classList.add("dragging");
      card.style.transform = `translateX(${dx}px)`;
    });

    function end() {
      if (!dragging) { clearPress(); return; }
      dragging = false;
      clearPress();
      card.classList.remove("dragging");
      if (horizontal && dx > THRESH) {
        // 오른쪽 스와이프 → 내일로
        const reason = tomorrowBlockReason(id, dateKey);
        if (reason) {
          card.style.transform = "translateX(0)";
          showToast(reason);
        } else {
          removeWithAnim(wrap, card, 1, () => moveToTomorrow(id, dateKey), "내일로 옮겼어요");
        }
      } else if (horizontal && dx < -THRESH) {
        // 왼쪽 스와이프 → 삭제
        removeWithAnim(wrap, card, -1, () => deleteItem(id, dateKey), "삭제했어요");
      } else {
        card.style.transform = "translateX(0)";
      }
      dx = 0;
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);

    card.addEventListener("click", e => {
      if (longFired) { e.stopPropagation(); longFired = false; }
    }, true);
  }

  /* 항목을 밀어내고 높이를 접은 뒤 데이터 반영 */
  function removeWithAnim(wrap, card, dir, mutate, msg) {
    card.style.transition = "transform .3s cubic-bezier(.4,0,.2,1), opacity .25s ease";
    card.style.transform = `translateX(${dir * 110}%)`;
    card.style.opacity = "0";
    if (msg) showToast(msg);
    setTimeout(() => {
      wrap.style.height = wrap.offsetHeight + "px";
      wrap.style.transition = "height .25s ease, margin .25s ease";
      requestAnimationFrame(() => {
        wrap.style.height = "0px";
        wrap.style.marginBottom = "0px";
      });
      setTimeout(() => { mutate(); commit(); }, 260);
    }, 280);
  }

  /* ================= 순서 변경 (드래그앤드롭) ================= */
  function attachReorder(handle, wrap) {
    handle.addEventListener("pointerdown", e => {
      e.preventDefault();
      e.stopPropagation();   // 스와이프/길게 누르기 로직과 분리
      handle.setPointerCapture(e.pointerId);

      const section = wrap.parentElement;
      const wraps = Array.from(section.children).filter(el => el.classList.contains("item-wrap"));
      const idx = wraps.indexOf(wrap);
      const rects = wraps.map(w => w.getBoundingClientRect());
      const mids = rects.map(r => r.top + r.height / 2);
      const dragH = rects[idx].height + 8;   // 8px = margin-bottom
      const startY = e.clientY;
      let target = idx;

      wrap.classList.add("reordering");

      const move = ev => {
        const dy = ev.clientY - startY;
        wrap.style.transform = `translateY(${dy}px)`;
        const cy = mids[idx] + dy;

        // 현재 중심이 다른 항목 중심보다 아래에 있는 개수 = 새 인덱스
        let t = 0;
        wraps.forEach((w, j) => { if (j !== idx && mids[j] < cy) t++; });
        target = t;

        // 자리를 비키기 위해 나머지 항목을 이동
        wraps.forEach((w, j) => {
          if (w === wrap) return;
          let shift = 0;
          if (target > idx && j > idx && j <= target) shift = -dragH;
          else if (target < idx && j >= target && j < idx) shift = dragH;
          w.style.transform = shift ? `translateY(${shift}px)` : "";
        });
      };

      const up = () => {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.removeEventListener("pointercancel", up);
        wrap.classList.remove("reordering");

        if (target === idx) {
          wraps.forEach(w => { w.style.transform = ""; });
          return;
        }
        // 최종 자리로 스냅 후 데이터 반영
        const finalDy = rects[target].top - rects[idx].top;
        wrap.style.transform = `translateY(${finalDy}px)`;
        const finalIndex = target;
        setTimeout(() => {
          reorderItem(wrap.dataset.id, wrap.dataset.date, finalIndex);
          commit();
        }, 230);
      };

      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
      handle.addEventListener("pointercancel", up);
    });
  }

  /* 같은 날짜·같은 시간대 안에서 항목 위치 변경 (저장 배열 순서 갱신) */
  function reorderItem(id, dateKey, toIndex) {
    const it = findItem(id);
    if (!it) return;
    const list = itemsOn(dateKey).filter(x => x.period === it.period);
    const from = list.indexOf(it);
    if (from < 0) return;
    list.splice(from, 1);
    list.splice(toIndex, 0, it);

    const slots = [];
    state.data.items.forEach((x, i) => { if (list.includes(x)) slots.push(i); });
    slots.forEach((slot, k) => { state.data.items[slot] = list[k]; });
  }

  /* ================= 데이터 변경 ================= */
  function commit() {
    saveData();
    render();
  }

  /* 완료 토글: 전체 재렌더 없이 해당 항목만 애니메이션 */
  function toggleDone(id, dateKey, wrap) {
    const it = findItem(id); if (!it) return;
    it.overrides = it.overrides || {};
    const cur = it.overrides[dateKey] || {};
    const nowDone = !cur.done;
    it.overrides[dateKey] = { ...cur, done: nowDone };
    saveData();

    const card = wrap.querySelector(".item");
    card.classList.toggle("done", nowDone);
    card.classList.remove("pulse");
    void card.offsetWidth;            // 애니메이션 재시작
    card.classList.add("pulse");

    const old = card.querySelector(".check");
    if (nowDone && !old) {
      const c = document.createElement("div");
      c.className = "check enter";
      card.insertBefore(c, card.firstChild);
    } else if (!nowDone && old) {
      old.classList.remove("enter");
      old.classList.add("leave");
      setTimeout(() => old.remove(), 200);
    }
  }

  /* 내일로 옮길 수 있는지 검사 (내일 해당 시간대가 가득 찼는지) */
  function tomorrowBlockReason(id, dateKey) {
    const it = findItem(id); if (!it) return null;
    const tomorrow = addDays(dateKey, 1);
    if (isVisibleOn(it, tomorrow)) return null;   // 이미 내일 보이는 항목(매일 반복 등)
    if (countOn(tomorrow, it.period) >= MAX_PER_PERIOD) {
      return `내일 ${periodLabel(it.period)} 시간대가 가득 찼어요`;
    }
    return null;
  }

  function moveToTomorrow(id, dateKey) {
    const it = findItem(id); if (!it) return;
    const tomorrow = addDays(dateKey, 1);
    it.overrides = it.overrides || {};
    if (it.repeat) {
      // 이 날짜 인스턴스만 이동
      it.overrides[dateKey] = { ...(it.overrides[dateKey] || {}), moved: tomorrow };
      it.incoming = (it.incoming || []).filter(d => d !== dateKey);
      if (!it.incoming.includes(tomorrow)) it.incoming.push(tomorrow);
      if (it.overrides[tomorrow]) it.overrides[tomorrow] = { ...it.overrides[tomorrow], deleted: false };
    } else {
      it.startDate = tomorrow;
    }
  }

  function deleteItem(id, dateKey) {
    const it = findItem(id); if (!it) return;
    if (it.repeat) {
      it.overrides = it.overrides || {};
      it.overrides[dateKey] = { ...(it.overrides[dateKey] || {}), deleted: true };
    } else {
      state.data.items = state.data.items.filter(i => i.id !== id);
    }
  }

  /* ================= 날짜 선택 캘린더 ================= */
  function openModal(kind) {
    modal = kind;
    overlay.classList.add("show");
  }
  function closeModal() {
    overlay.classList.remove("show");
    modal = null;
    form = null;
    calState = null;
  }

  function openCalendar() {
    const base = parseKey(state.viewDate);
    calState = { year: base.getFullYear(), month: base.getMonth(), selected: state.viewDate };
    openModal("calendar");
    renderCalendar();
  }

  function renderCalendar() {
    const today = todayKey();
    const { year, month, selected } = calState;
    const firstDow = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    let cells = "";
    for (let i = 0; i < firstDow; i++) cells += `<div></div>`;
    for (let d = 1; d <= lastDate; d++) {
      const key = `${year}-${pad(month + 1)}-${pad(d)}`;
      const cls = ["cal-day",
        key < today ? "past" : "",
        key === today ? "today" : "",
        key === selected ? "sel" : ""].join(" ").replace(/\s+/g, " ").trim();
      const hasItems = itemsOn(key).length > 0;
      cells += `<button class="${cls}" data-day="${key}">${d}${hasItems ? `<span class="dot"></span>` : ""}</button>`;
    }

    const list = PERIODS.flatMap(p => itemsOn(selected).filter(i => i.period === p.key));
    const rows = list.length
      ? list.map(it => {
          const s = stateOn(it, selected);
          return `<div class="cal-row ${s.done ? "done" : ""}"><span class="pl">${periodLabel(it.period)}</span><span class="pt">${escapeHtml(it.title)}</span></div>`;
        }).join("")
      : `<div class="cal-empty">일정이 없습니다.</div>`;

    sheet.innerHTML = `
      <div class="cal-head">
        <button class="nav" data-mv="-1" aria-label="이전 달">‹</button>
        <div class="ym">${year}년 ${month + 1}월</div>
        <button class="nav" data-mv="1" aria-label="다음 달">›</button>
      </div>
      <div class="cal-week">${["일","월","화","수","목","금","토"].map(w => `<div>${w}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-preview">
        <div class="p-title">${formatHeaderDate(selected)}</div>
        ${rows}
      </div>
      <div class="actions">
        <button class="btn-cancel" id="cal-close">닫기</button>
        <button class="btn-save" id="cal-go">이 날짜 보기</button>
      </div>`;

    sheet.querySelectorAll("[data-mv]").forEach(b => b.addEventListener("click", () => {
      let m = calState.month + Number(b.dataset.mv);
      let y = calState.year;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      calState.year = y;
      calState.month = m;
      renderCalendar();
    }));

    sheet.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => {
      calState.selected = b.dataset.day;
      renderCalendar();
    }));

    document.getElementById("cal-close").addEventListener("click", closeModal);
    document.getElementById("cal-go").addEventListener("click", () => {
      state.viewDate = calState.selected;
      closeModal();
      render();
      window.scrollTo(0, 0);
    });
  }

  /* ================= 태그 화면 ================= */
  function openTagView(tag) {
    state.view = { name: "tag", tag };
    render();
    window.scrollTo(0, 0);
  }

  function renderTagView(tag) {
    const matched = state.data.items.filter(it => (it.tags || []).includes(tag));
    const sorted = matched.slice().sort((a, b) => (a.startDate < b.startDate ? -1 : 1));

    let html = `
      <header>
        <button class="back" id="backBtn">← 홈</button>
        <div class="tag-label">태그</div>
        <h1>#${escapeHtml(tag)}</h1>
      </header>`;

    if (sorted.length === 0) {
      html += `<div class="empty-state">이 태그가 달린 일정이 없습니다.</div>`;
    } else {
      html += `<section class="period">`;
      sorted.forEach(it => {
        const when = it.repeat ? repeatLabel(it) : formatShortDate(it.startDate);
        html += `
          <div class="item-wrap" style="pointer-events:none">
            <div class="item" style="pointer-events:auto;cursor:default">
              <div class="body">
                <div class="title">${escapeHtml(it.title)}</div>
                <div class="meta"><span class="time-info">${periodLabel(it.period)} · ${when}</span></div>
              </div>
            </div>
          </div>`;
      });
      html += `</section>`;
    }

    app.innerHTML = html;
    document.getElementById("backBtn").addEventListener("click", () => {
      state.view = { name: "home" }; render(); window.scrollTo(0, 0);
    });
  }

  function render() {
    if (state.view.name === "tag") {
      renderTagView(state.view.tag);
      fab.style.display = "none";
    } else {
      renderHome();   // 홈에서 FAB 표시 여부 결정
    }
  }

  /* ================= 추가 폼 ================= */
  let form = null;

  function openForm() {
    form = {
      title: "",
      date: state.viewDate,   // 보고 있는 날짜가 기본값
      period: null,
      tags: [],
      tagInput: "",
      repeatOn: false,
      repeatType: "daily",   // daily | weekly | monthly
      endMode: "none",       // none | date
      endDate: "",
    };
    renderForm();
    openModal("form");
  }

  function renderForm() {
    const today = todayKey();
    const periodBtns = PERIODS.map(p => {
      const full = countOn(form.date, p.key) >= MAX_PER_PERIOD;
      return `<button data-period="${p.key}" class="${form.period === p.key ? "on" : ""}" ${full ? "disabled" : ""}>${p.label}${full ? " (가득참)" : ""}</button>`;
    }).join("");

    const tagChips = form.tags.map(t => `<button class="chip-btn on" data-rm-tag="${escapeHtml(t)}">#${escapeHtml(t)} ✕</button>`).join("");

    sheet.innerHTML = `
      <h3>새 일정</h3>
      <div class="field">
        <label>일정 내용</label>
        <input type="text" id="f-title" value="${escapeHtml(form.title)}" placeholder="무엇에 집중할까요?" maxlength="60" />
      </div>
      <div class="field">
        <label>날짜</label>
        <input type="date" id="f-date" min="${today}" value="${form.date}" />
      </div>
      <div class="field">
        <label>시간대 (해당 날짜 기준 섹션당 최대 ${MAX_PER_PERIOD}개)</label>
        <div class="seg">${periodBtns}</div>
        <div class="notice" id="f-notice"></div>
      </div>
      <div class="field">
        <label>태그 (Enter로 추가)</label>
        <input type="text" id="f-tag" value="${escapeHtml(form.tagInput)}" placeholder="예: 운동, 공부" maxlength="20" />
        <div class="chips" style="margin-top:8px">${tagChips}</div>
      </div>
      <div class="field">
        <div class="toggle-row">
          <label style="margin:0;color:var(--text);font-size:15px">반복 일정</label>
          <label class="switch"><input type="checkbox" id="f-repeat" ${form.repeatOn ? "checked" : ""}/><span></span></label>
        </div>
        <div class="repeat-opts ${form.repeatOn ? "show" : ""}">
          <div class="seg" style="margin-bottom:12px">
            <button data-rtype="daily" class="${form.repeatType === "daily" ? "on" : ""}">매일</button>
            <button data-rtype="weekly" class="${form.repeatType === "weekly" ? "on" : ""}">매주</button>
            <button data-rtype="monthly" class="${form.repeatType === "monthly" ? "on" : ""}">매월</button>
          </div>
          <div class="seg" style="margin-bottom:12px">
            <button data-endmode="none" class="${form.endMode === "none" ? "on" : ""}">종료일 없음</button>
            <button data-endmode="date" class="${form.endMode === "date" ? "on" : ""}">종료일 설정</button>
          </div>
          ${form.endMode === "date" ? `<input type="date" id="f-enddate" min="${form.date || today}" value="${form.endDate}" />` : ""}
        </div>
      </div>
      <div class="actions">
        <button class="btn-cancel" id="f-cancel">취소</button>
        <button class="btn-save" id="f-save" disabled>추가</button>
      </div>`;

    bindFormEvents();
    validateForm();
  }

  function validateForm() {
    const d = form.date;
    const dateOk = !!d && d >= todayKey();
    const ok = form.title.trim().length > 0 && dateOk && !!form.period &&
      countOn(d, form.period) < MAX_PER_PERIOD &&
      (!form.repeatOn || form.endMode === "none" || (form.endMode === "date" && form.endDate && form.endDate >= d));
    const btn = document.getElementById("f-save");
    if (btn) btn.disabled = !ok;
    return ok;
  }

  function bindFormEvents() {
    const titleEl = document.getElementById("f-title");
    titleEl.addEventListener("input", e => { form.title = e.target.value; validateForm(); });

    document.getElementById("f-date").addEventListener("change", e => {
      form.date = e.target.value;
      if (form.date) {
        // 새 날짜에서 가득 찬 시간대는 선택 해제
        if (form.period && countOn(form.date, form.period) >= MAX_PER_PERIOD) form.period = null;
        if (form.endDate && form.endDate < form.date) form.endDate = "";
      }
      renderForm();
    });

    sheet.querySelectorAll("[data-period]").forEach(b => b.addEventListener("click", () => {
      if (b.disabled) return;
      form.period = b.dataset.period;
      renderForm();
    }));

    const tagEl = document.getElementById("f-tag");
    tagEl.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        const t = tagEl.value.trim().replace(/^#/, "");
        if (t && !form.tags.includes(t) && form.tags.length < 5) form.tags.push(t);
        form.tagInput = "";
        renderForm();
        document.getElementById("f-tag").focus();
      }
    });
    tagEl.addEventListener("input", e => { form.tagInput = e.target.value; });

    sheet.querySelectorAll("[data-rm-tag]").forEach(b => b.addEventListener("click", () => {
      form.tags = form.tags.filter(t => t !== b.dataset.rmTag);
      renderForm();
    }));

    document.getElementById("f-repeat").addEventListener("change", e => {
      form.repeatOn = e.target.checked;
      if (!form.repeatOn) { form.endMode = "none"; form.endDate = ""; }
      renderForm();
    });

    sheet.querySelectorAll("[data-rtype]").forEach(b => b.addEventListener("click", () => {
      form.repeatType = b.dataset.rtype; renderForm();
    }));
    sheet.querySelectorAll("[data-endmode]").forEach(b => b.addEventListener("click", () => {
      form.endMode = b.dataset.endmode;
      if (form.endMode === "none") form.endDate = "";
      renderForm();
    }));

    const endEl = document.getElementById("f-enddate");
    if (endEl) endEl.addEventListener("change", e => { form.endDate = e.target.value; validateForm(); });

    document.getElementById("f-cancel").addEventListener("click", closeModal);
    document.getElementById("f-save").addEventListener("click", submitForm);
  }

  function submitForm() {
    if (!validateForm()) return;
    const item = {
      id: "i_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: form.title.trim(),
      period: form.period,
      tags: form.tags.slice(),
      startDate: form.date,
      repeat: form.repeatOn
        ? { type: form.repeatType, endDate: form.endMode === "date" ? form.endDate : null }
        : null,
      overrides: {},
      incoming: [],
      createdAt: Date.now(),
    };
    state.data.items.push(item);
    closeModal();
    commit();
  }

  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  fab.addEventListener("click", openForm);

  /* ================= 초기화 ================= */
  render();

  // 자정이 지나면 오늘 화면 갱신. 오늘을 보고 있었다면 새 오늘로 이동
  let lastDay = todayKey();
  setInterval(() => {
    const now = todayKey();
    if (now !== lastDay) {
      if (state.viewDate === lastDay) state.viewDate = now;
      lastDay = now;
      if (state.view.name === "home") render();
    }
  }, 30000);
})();
</script>
</body>
</html>
